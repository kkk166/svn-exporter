name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 安装依赖
        run: npm ci

      - name: 安装 vsce
        run: npm install -g @vscode/vsce

      - name: 打包扩展
        run: vsce package

      - name: 提取 CHANGELOG 内容
        id: changelog
        run: |
          # 提取当前版本对应的更新内容（从 ## [x.x.x] 到下一个 ##）
          TAG=${GITHUB_REF#refs/tags/v}
          CONTENT=$(awk "/^## \[$TAG\]/{found=1; next} /^## \[/{if(found) exit} found{print}" CHANGELOG.md)
          if [ -z "$CONTENT" ]; then
            CONTENT="详见 [CHANGELOG.md](CHANGELOG.md)"
          fi
          # 写入多行环境变量
          echo "body<<EOF" >> $GITHUB_OUTPUT
          echo "$CONTENT" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: 创建 Release 并上传 .vsix
        uses: softprops/action-gh-release@v2
        with:
          body: ${{ steps.changelog.outputs.body }}
          files: '*.vsix'
