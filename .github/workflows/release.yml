name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 安装依赖
        run: npm ci

      - name: 安装 vsce
        run: npm install -g @vscode/vsce

      - name: 打包扩展
        run: vsce package

      - name: 创建 Release 并上传 .vsix
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: '*.vsix'
